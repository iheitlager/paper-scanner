abstract: Digital transformation (DT) is a major challenge for incumbent organisations,
  as research on this phenomenon has revealed a high failure rate. Given this consideration,
  this paper reviews the literature on DT in incumbent organisations to identify the
  main themes and research directions to be undertaken. The authors adopt a systematic
  literature review (SLR) and computational literature review (CLR) employing a machine
  learning algorithm for topic modelling (LDA) to surface the themes discussed in
  103 peer-reviewed studies published between 2010 and 2022 in a
