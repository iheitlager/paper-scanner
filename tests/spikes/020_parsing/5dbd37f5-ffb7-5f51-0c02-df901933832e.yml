journal: Journal of the Association for Information Systems
title: 'From Product Platform Ecosystem to Innovation Platform Ecosystem: An Institutional
  Perspective on the Governance of Ecosystem Transformations'
authors:
- name: Maximilian Schreieck
  affiliation: University of Innsbruck
- name: Manuel Wiesche
  affiliation: TU Dortmund University
- name: Helmut Krcmar
  affiliation: Technical University of Munich
year: 2022
volume: 23
issue: 6
pages: 1354-1385
doi: 10.17705/1jais.00764
abstract: Incumbent companies across industries such as banking, insurance, and enterprise
  software have begun transforming their existing product platform ecosystems into
  innovation platforms ecosystems to increase generativity in their ecosystems. Such
  ecosystem transformations not only entail technological challenges as the underlying
  platform technology changes but also organizational challenges in that ecosystem
  actors such as partners and customers need to become part of the transformed ecosystem.
  To study how incumbent companies can govern ecosystem transformations successfully,
  we interpret ecosystems as organizational fields and ecosystem transformations as
  changes to the fields' institutional infrastructure. Based on a multiyear, grounded
  theory study of the transformation of SAP's on-premises ERP system, we first identify
  institutionalization challenges that arise when institutional infrastructure is
  changed during an ecosystem transformation.
