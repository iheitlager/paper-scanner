abstract: The purpose of this paper is to broaden extant understanding of actor engagement
  behavior beyond its currently dominant dyadic (micro-level) focus, by examining
  it from multiple levels of aggregation within a service ecosystem framework. This
  conceptual paper draws on service-dominant logic and structuration theory as theoretical
  lenses to inform engagement research. By means of a stepwise exercise of "zooming
  out," the paper introduces a multi-perspective (micro-, meso-, macro- and meta-level)
  view of
