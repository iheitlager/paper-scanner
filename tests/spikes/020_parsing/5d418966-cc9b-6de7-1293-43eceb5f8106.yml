year: 2018
volume: 200
issue: null
pages: 343-352
doi: 10.1016/j.ijpe.2018.04.001
abstract: How to resolve the dilemma of ambidexterity, or simultaneous alignment and
  adaption, is a vital issue in the operational field. Based on the resource management
  model, we argue that capability configurations could work as effective strategies
  for leveraging the potential of capabilities and benefit the pursuit of contradictory
  ambidexterity. This study explores how complementary and balance configurations
  of technological and marketing capabilities influence alignment and adaption and
  improve firm performance. Through regression analysis of data collected from service-outsourcing
  vendors in China, we provide evidence that both the complementary and balance configurations
  of these two capabilities can be used to achieve alignment and adaption, thereby
  improving firm performance.
keywords:
