version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# MkDocs configuration
mkdocs:
  configuration: mkdocs.yml

# Fail on warnings
fail_on_warning: false

# Install dependencies from pyproject.toml
python:
  install:
    - method: pip
      path: .
      extra_requirements: 
        - docs
