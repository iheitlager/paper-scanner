site_name: paper-scanner
site_description: Python LLM-powered literature review tool for analyzing academic PDFs
site_author: paper-scanner contributors
site_url: https://paper-scanner.readthedocs.io

# Repository
repo_url: https://github.com/iheitlager/paper-scanner
repo_name: paper-scanner
edit_uri: edit/main/docs/

# Build settings
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    - scheme: light
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: dark
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - awesome-pages

nav:
  - Home: index.md
  - User Guide:
    - Getting Started: guide/getting-started.md
    - Installation: guide/installation.md
    - Quick Start: guide/quick-start.md
  - Architecture:
    - Overview: architecture/overview.md
    - Pipeline Architecture: architecture/pipeline.md
    - Data Models: architecture/models.md
  - Steps:
    - Overview: steps/overview.md
    - '!include ./docs/steps/.pages'
  - API Reference:
    - Core: api/core.md
    - Steps: api/steps.md
    - CLI: api/cli.md
  - Architecture Decision Records:
    - Overview: adr/index.md
    - '!include ./docs/adr/.pages'
  - Contributing:
    - Development Setup: contributing/setup.md
    - Testing: contributing/testing.md
    - Code Standards: contributing/standards.md
  - FAQ: faq.md

# Extra
extra:
  version:
    provider: mike

watch:
  - src/paper_scanner
