[project]
name = "paper-scanner"
dynamic = ["version"]
description = "LLM Paper analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ilja Heitlager", email = "ilja@heitlager.com"}
]
maintainers = [
    {name = "Ilja Heitlager", email = "ilja@heitlager.com"}
]
keywords = ["research-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English"
]

dependencies = [
    "anthropic==0.75.0",
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.12.5",
    "pypdf==6.4.0",
    "pyyaml>=6.0",
    "requests==2.32.5",
    "rich>=14.2.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.2",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.14.0",
    "mypy>=1.8.0",
    "gunicorn>=23.0.0",
    "pdfplumber>=0.11.8",
]

local = [
    "torch",
    "torchvision",
    "torchaudio",
    "transformers",
    "accelerate",
    "sentencepiece",
]

[project.scripts]
file-scanner = "paper_scanner.cli.file_scanner:main"
file-reader = "paper_scanner.cli.file_reader:main"
file-merge = "paper_scanner.cli.file_merge:main"
file-processor-references = "paper_scanner.cli.file_processor_references:main"
file-timer = "paper_scanner.cli.file_timer:main"
paper-processor = "paper_scanner.cli.paper_processor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paper_scanner/__init__.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # I enables isort rules, W for line length
ignore = ["E501", "E741"]  # Line too long, ambiguous variable name

[tool.ruff.format]
quote-style = "double"
