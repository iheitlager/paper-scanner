services:
  pdf-browser-db:
    image: pgvector/pgvector:pg15  # Changed to pgvector image
    container_name: pdf-browser-db
    environment:
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: pdfpass
      POSTGRES_DB: pdfdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./etc/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfuser -d pdfdb"]
      interval: 10s
      timeout: 5s
      retries: 5

